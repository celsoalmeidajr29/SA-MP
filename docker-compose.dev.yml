services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: osc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: osc
      POSTGRES_PASSWORD: oscpassword
      POSTGRES_DB: oscdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: osc_redis
    restart: unless-stopped
    command: redis-server --requirepass oscredis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: osc_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oscminio
      MINIO_ROOT_PASSWORD: oscminio123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  postgres_data:
  redis_data:
  minio_data:
