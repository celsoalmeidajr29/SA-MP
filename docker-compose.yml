services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: osc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oscpassword}
      POSTGRES_DB: ${POSTGRES_DB:-oscdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - osc_network

  redis:
    image: redis:7-alpine
    container_name: osc_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-oscredis}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - osc_network

  minio:
    image: minio/minio:latest
    container_name: osc_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-oscminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-oscminio123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - osc_network

  bot:
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
    container_name: osc_bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot_sessions:/app/sessions
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - osc_network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: osc_web
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
    networks:
      - osc_network

  nginx:
    image: nginx:alpine
    container_name: osc_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
    networks:
      - osc_network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  bot_sessions:
  nginx_logs:

networks:
  osc_network:
    driver: bridge
